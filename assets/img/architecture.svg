<svg viewBox="0 0 960 640" xmlns="http://www.w3.org/2000/svg" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2f6f4f"/>
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/>
    </marker>
  </defs>

  <rect width="960" height="640" fill="#fafaf8"/>
  <text x="20" y="22" fill="#6b7280" font-size="12">Arda 시스템 아키텍처 — 2026-09-22 (클라우드 · Anthropic Claude 서빙)</text>

  <!-- AWS 영역 -->
  <rect x="440" y="40" width="500" height="420" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="920" y="62" text-anchor="end" fill="#9ca3af" font-weight="600">AWS 서울 · EC2 t3.medium (Docker Compose) · S3</text>

  <!-- 사용자 -->
  <g>
    <rect x="20" y="80" width="150" height="58" rx="10" fill="#ffffff" stroke="#cfd6d2"/>
    <text x="95" y="103" text-anchor="middle" font-weight="600" fill="#1f2328">지원자</text>
    <text x="95" y="123" text-anchor="middle" fill="#6b7280" font-size="11">브라우저 · Flutter 앱 · 링크/로그인</text>
  </g>
  <g>
    <rect x="20" y="170" width="150" height="58" rx="10" fill="#ffffff" stroke="#cfd6d2"/>
    <text x="95" y="193" text-anchor="middle" font-weight="600" fill="#1f2328">담당자 · 면접관</text>
    <text x="95" y="213" text-anchor="middle" fill="#6b7280" font-size="11">JWT 12h · admin / member</text>
  </g>

  <!-- 프론트 -->
  <g>
    <rect x="230" y="110" width="170" height="78" rx="10" fill="#ffffff" stroke="#cfd6d2"/>
    <text x="315" y="138" text-anchor="middle" font-weight="600" fill="#1f2328">React 프론트</text>
    <text x="315" y="157" text-anchor="middle" fill="#6b7280" font-size="11">React 19 · Vite · TS</text>
    <text x="315" y="174" text-anchor="middle" fill="#6b7280" font-size="11">Vercel · main 머지 자동 배포</text>
  </g>

  <!-- Caddy -->
  <g>
    <rect x="460" y="110" width="120" height="58" rx="10" fill="#ffffff" stroke="#cfd6d2"/>
    <text x="520" y="133" text-anchor="middle" font-weight="600" fill="#1f2328">Caddy</text>
    <text x="520" y="152" text-anchor="middle" fill="#6b7280" font-size="11">443 · TLS 자동</text>
  </g>

  <!-- API -->
  <g>
    <rect x="610" y="95" width="170" height="88" rx="10" fill="#eef4f1" stroke="#2f6f4f"/>
    <text x="695" y="120" text-anchor="middle" font-weight="600" fill="#1f2328">FastAPI API</text>
    <text x="695" y="139" text-anchor="middle" fill="#6b7280" font-size="11">헥사고날 · Bounded Context 4</text>
    <text x="695" y="156" text-anchor="middle" fill="#6b7280" font-size="11">아르 도구 호출 · 자동 서류 심사</text>
    <text x="695" y="173" text-anchor="middle" fill="#6b7280" font-size="11">Swagger /docs · alembic 기동 시 이행</text>
  </g>

  <!-- S3 (위) · PostgreSQL (아래) -->
  <g>
    <rect x="800" y="70" width="130" height="58" rx="10" fill="#ffffff" stroke="#cfd6d2"/>
    <text x="865" y="93" text-anchor="middle" font-weight="600" fill="#1f2328">S3</text>
    <text x="865" y="112" text-anchor="middle" fill="#6b7280" font-size="11">이력서 · presigned · SSE</text>
  </g>
  <g>
    <rect x="800" y="150" width="130" height="58" rx="10" fill="#ffffff" stroke="#cfd6d2"/>
    <text x="865" y="173" text-anchor="middle" font-weight="600" fill="#1f2328">PostgreSQL 16</text>
    <text x="865" y="192" text-anchor="middle" fill="#6b7280" font-size="11">+ pgvector · 28 테이블</text>
  </g>
  <g>
    <rect x="800" y="230" width="130" height="58" rx="10" fill="#ffffff" stroke="#cfd6d2"/>
    <text x="865" y="253" text-anchor="middle" font-weight="600" fill="#1f2328">무결성 원장</text>
    <text x="865" y="272" text-anchor="middle" fill="#6b7280" font-size="11">SHA-256 사슬 · 트리거 잠금</text>
  </g>
  <g>
    <rect x="800" y="320" width="130" height="58" rx="10" fill="#ffffff" stroke="#cfd6d2" stroke-dasharray="5 4"/>
    <text x="865" y="343" text-anchor="middle" font-weight="600" fill="#1f2328">관측 · 백업</text>
    <text x="865" y="362" text-anchor="middle" fill="#6b7280" font-size="11">CloudWatch·SNS · 매일 S3 덤프</text>
  </g>

  <!-- lie-detection -->
  <g>
    <rect x="610" y="220" width="170" height="70" rx="10" fill="#ffffff" stroke="#cfd6d2"/>
    <text x="695" y="243" text-anchor="middle" font-weight="600" fill="#1f2328">lie-detection  /ai/*</text>
    <text x="695" y="262" text-anchor="middle" fill="#6b7280" font-size="11">실시간 면접 WebRTC · 로컬 STT</text>
    <text x="695" y="279" text-anchor="middle" fill="#6b7280" font-size="11">MediaPipe · ViT (참고 지표만)</text>
  </g>

  <!-- n8n -->
  <g>
    <rect x="610" y="320" width="170" height="58" rx="10" fill="#ffffff" stroke="#cfd6d2"/>
    <text x="695" y="343" text-anchor="middle" font-weight="600" fill="#1f2328">n8n  /n8n/*</text>
    <text x="695" y="362" text-anchor="middle" fill="#6b7280" font-size="11">메일 웹훅 → SMTP</text>
  </g>

  <!-- 외부 AI API 그룹 -->
  <rect x="430" y="482" width="360" height="118" rx="12" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="440" y="500" fill="#b45309" font-size="11" font-weight="600">외부 AI API (사용량 과금 · 개인정보 미포함)</text>
  <g>
    <rect x="445" y="510" width="170" height="78" rx="10" fill="#ffffff" stroke="#f59e0b"/>
    <text x="530" y="533" text-anchor="middle" font-weight="600" fill="#1f2328">Anthropic Claude</text>
    <text x="530" y="552" text-anchor="middle" fill="#6b7280" font-size="11">요약·평가·추천 3단 체인</text>
    <text x="530" y="569" text-anchor="middle" fill="#6b7280" font-size="11">아르 도구 호출 · FAQ (haiku-4-5)</text>
  </g>
  <g>
    <rect x="630" y="510" width="145" height="78" rx="10" fill="#ffffff" stroke="#f59e0b"/>
    <text x="702" y="533" text-anchor="middle" font-weight="600" fill="#1f2328">OpenAI Whisper</text>
    <text x="702" y="552" text-anchor="middle" fill="#6b7280" font-size="11">아르 음성 입력 · 업로드 재전사</text>
    <text x="702" y="569" text-anchor="middle" fill="#6b7280" font-size="11">whisper-1 · 무음 게이트</text>
  </g>

  <!-- SMTP -->
  <g>
    <rect x="810" y="510" width="130" height="66" rx="10" fill="#ffffff" stroke="#cfd6d2"/>
    <text x="875" y="533" text-anchor="middle" font-weight="600" fill="#1f2328">SMTP (Gmail)</text>
    <text x="875" y="552" text-anchor="middle" fill="#6b7280" font-size="11">단계 변경 · 면접 링크 메일</text>
    <text x="875" y="568" text-anchor="middle" fill="#6b7280" font-size="10">n8n 장애 시 API 가 5분마다 재발송</text>
  </g>

  <!-- GitHub Actions · Sepolia -->
  <g>
    <rect x="20" y="510" width="170" height="66" rx="10" fill="#ffffff" stroke="#cfd6d2" stroke-dasharray="5 4"/>
    <text x="105" y="533" text-anchor="middle" font-weight="600" fill="#1f2328">GitHub Actions</text>
    <text x="105" y="552" text-anchor="middle" fill="#6b7280" font-size="11">CI 5잡 · 외부 헬스체크</text>
    <text x="105" y="568" text-anchor="middle" fill="#6b7280" font-size="11">앵커 서명 (개인키 서버 밖)</text>
  </g>
  <g>
    <rect x="230" y="510" width="170" height="66" rx="10" fill="#ffffff" stroke="#cfd6d2"/>
    <text x="315" y="533" text-anchor="middle" font-weight="600" fill="#1f2328">Ethereum Sepolia</text>
    <text x="315" y="552" text-anchor="middle" fill="#6b7280" font-size="11">테스트넷 · 사슬 머리 매일 앵커</text>
    <text x="315" y="568" text-anchor="middle" fill="#6b7280" font-size="11">+ OpenTimestamps (ADR-0028)</text>
  </g>

  <!-- 화살표: 사용자 → 프론트 -->
  <line x1="170" y1="109" x2="224" y2="140" stroke="#2f6f4f" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="170" y1="199" x2="224" y2="160" stroke="#2f6f4f" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- 프론트 → Caddy → API -->
  <line x1="400" y1="149" x2="454" y2="139" stroke="#2f6f4f" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="427" y="130" text-anchor="middle" fill="#2f6f4f" font-size="11">HTTPS</text>
  <line x1="580" y1="139" x2="604" y2="139" stroke="#2f6f4f" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- Caddy → lie-detection / n8n -->
  <line x1="545" y1="168" x2="604" y2="250" stroke="#2f6f4f" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="556" y="228" text-anchor="middle" fill="#2f6f4f" font-size="11">/ai/* WS·WebRTC</text>
  <line x1="510" y1="168" x2="604" y2="345" stroke="#2f6f4f" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="530" y="300" text-anchor="middle" fill="#2f6f4f" font-size="11">/n8n/*</text>
  <!-- API → S3 / PG -->
  <line x1="780" y1="120" x2="794" y2="102" stroke="#2f6f4f" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="798" y="130" text-anchor="end" fill="#2f6f4f" font-size="10">presign</text>
  <line x1="780" y1="160" x2="794" y2="176" stroke="#2f6f4f" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- PG → 원장 (트리거) -->
  <line x1="865" y1="208" x2="865" y2="224" stroke="#2f6f4f" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- API → n8n (메일 웹훅) -->
  <path d="M 780 178 H 792 V 349 H 786" fill="none" stroke="#2f6f4f" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="796" y="300" fill="#2f6f4f" font-size="10" transform="rotate(90 796 300)">메일 웹훅</text>
  <!-- n8n → SMTP -->
  <line x1="740" y1="378" x2="850" y2="504" stroke="#2f6f4f" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="815" y="430" text-anchor="middle" fill="#2f6f4f" font-size="11">SMTP 발송</text>
  <!-- API → 외부 AI API -->
  <path d="M 612 178 H 595 V 476 H 560 V 505" fill="none" stroke="#b45309" stroke-width="1.5" marker-end="url(#arrow-amber)"/>
  <text x="585" y="330" fill="#b45309" font-size="10" transform="rotate(90 585 330)">3단 체인 · 도구 호출 · 재전사</text>
  <!-- 이력서 직접 업로드 -->
  <path d="M 95 80 V 32 H 865 V 66" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow-gray)"/>
  <text x="480" y="28" text-anchor="middle" fill="#6b7280" font-size="11">이력서 직접 업로드 (presigned URL — API 서버 미경유) · 해시는 원장에</text>
  <!-- CI/CD -->
  <path d="M 105 510 V 478 H 470 V 464" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow-gray)"/>
  <text x="290" y="474" text-anchor="middle" fill="#6b7280" font-size="11">main 머지 → 서버가 2분마다 폴링 → pull · build · up (자동 CD, systemd)</text>
  <!-- 앵커 -->
  <line x1="190" y1="543" x2="224" y2="543" stroke="#2f6f4f" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- 범례 -->
  <text x="20" y="620" fill="#6b7280" font-size="11">실선 = 요청 경로 · 점선 = 배포/우회 경로 · 주황 = 외부 AI API (실시간 면접 음성은 서버 안 로컬 전사, 표정·음성 신호는 점수에 미반영 — ADR-0029·0038)</text>
</svg>
